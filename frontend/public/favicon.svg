<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- ISF-INFRA mark: 5 capped spokes + pointed bottom nib -->
  <g stroke="#141414" stroke-width="3.4" stroke-linecap="round">
    <line x1="32" y1="34" x2="32" y2="12"/>
    <line x1="32" y1="34" x2="13.5" y2="19.5"/>
    <line x1="32" y1="34" x2="50.5" y2="19.5"/>
    <line x1="32" y1="34" x2="9" y2="34"/>
    <line x1="32" y1="34" x2="55" y2="34"/>
  </g>
  <g fill="#141414">
    <!-- spoke end caps -->
    <rect x="29.3" y="9.3" width="5.4" height="5.4" rx="1.3"/>
    <rect x="10.8" y="16.8" width="5.4" height="5.4" rx="1.3"/>
    <rect x="47.8" y="16.8" width="5.4" height="5.4" rx="1.3"/>
    <rect x="6.3" y="31.3" width="5.4" height="5.4" rx="1.3"/>
    <rect x="52.3" y="31.3" width="5.4" height="5.4" rx="1.3"/>
    <!-- central hub (diamond) -->
    <rect x="26.7" y="28.7" width="10.6" height="10.6" rx="1.8" transform="rotate(45 32 34)"/>
    <!-- bottom nib -->
    <path d="M32 35 L37 44 L32 58 L27 44 Z"/>
  </g>
</svg>
